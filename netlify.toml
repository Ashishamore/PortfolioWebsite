[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The site routes on the client (/work/specialty-pharma, /work/workive), so any path that isn't
# a real file gets index.html. Real files win, so the embedded app at /workive-app/ is still
# served as itself.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
